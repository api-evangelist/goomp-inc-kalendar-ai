description: Kalendar AI (Goomp Inc / Kalendar Inc, a Delaware corporation operating from New York) is an
  autonomous AI sales-agent platform that automates B2B outbound prospecting end to end. It sources ideal-customer
  prospects from a database of hundreds of millions of professionals and companies, generates and sends
  personalized outreach through dedicated AI-managed mailbox infrastructure, qualifies replies, and books
  meetings directly onto the user's calendar. The product is sold as a self-serve, per-agent subscription
  and connects to common CRMs, calendars, and productivity tools. It was surfaced as a portfolio company
  of 500 Global. As of this enrichment pass Kalendar AI publishes a marketing site and product app behind
  Cloudflare, legal (terms/privacy) and sign-in pages, but no public developer API, OpenAPI specification,
  SDK, or documented webhook surface.
