name: Goomp Inc, Kalendar AI
description: >-
  Kalendar AI (Goomp Inc / Kalendar Inc, a Delaware corporation operating from New York) is an
  autonomous AI sales-agent platform that automates B2B outbound prospecting end to end. It sources
  ideal-customer prospects from a database of hundreds of millions of professionals and companies,
  generates and sends personalized outreach through dedicated AI-managed mailbox infrastructure,
  qualifies replies, and books meetings directly onto the user's calendar. As of the 2026-08-13
  enrichment pass the company has rebranded to Cockpit AI and migrated to oncockpit.ai —
  kalendar.ai now 301-redirects site-wide, and the new site's robots.txt carries an explicit
  "Block legacy Kalendar.ai paths" section. The product is now framed as named AI workers you
  "hire" (Vinay for outbound, Amara), which research prospects, draft proposal documents, send
  from the customer's own email and LinkedIn accounts, and book meetings, with a human approval
  step before anything ships. Investors named on the site are 500 Global, Boost VC, Asymmetry
  Ventures and Village Global. The company runs a live API host (api.oncockpit.ai, which
  self-identifies as the "Cockpit AI API") and still serves a legacy ChatGPT plugin manifest at
  /.well-known/ai-plugin.json declaring OAuth with read/write scopes, but it publishes no
  developer portal, no API reference, no OpenAPI, no SDK, no webhook catalog, no MCP server and no
  pricing page.
